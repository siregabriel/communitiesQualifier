server {
    listen 80;
    listen [::]:80;
    server_name _;   # replace with your domain later

    # Allow inspection photo uploads
    client_max_body_size 20M;

    # Serve static files directly from the app's static folder
    location /static/ {
        alias /home/ubuntu/CommunitiesQualifier/app_mantenimiento/static/;
        expires 7d;
        access_log off;
    }

    # Everything else -> gunicorn
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
