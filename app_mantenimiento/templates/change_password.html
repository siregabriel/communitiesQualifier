<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set a new password — Atlas Excellence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('atlasTheme');
                if (t !== 'light' && t !== 'dark') {
                    t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f4f7fc; color: #0f1e36;
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .cp-card { width: 100%; max-width: 420px; background: #fff; border: 1px solid #e2e8f0;
            border-radius: 16px; padding: 34px 32px; box-shadow: 0 18px 50px rgba(2,32,80,.10); }
        .cp-logo { height: 40px; margin-bottom: 22px; }
        h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
        .cp-sub { font-size: 14px; color: #64748b; margin-bottom: 22px; line-height: 1.5; }
        .cp-note { display: flex; gap: 10px; background: #eef4ff; border: 1px solid #d3e2fb;
            color: #1e40af; border-radius: 10px; padding: 12px 14px; font-size: 13px; margin-bottom: 20px; }
        .cp-field { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 7px; }
        input[type=password] { width: 100%; padding: 12px 14px; border: 1.5px solid #d9dfe8;
            border-radius: 10px; font-size: 15px; background: #fff; color: #0f1e36; }
        input[type=password]:focus { outline: none; border-color: #1f6fe5; box-shadow: 0 0 0 3px rgba(31,111,229,.14); }
        .cp-btn { width: 100%; margin-top: 6px; background: #00285c; color: #fff; border: none;
            border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 700; cursor: pointer; }
        .cp-btn:hover { background: #013a82; }
        .cp-btn:disabled { opacity: .6; cursor: not-allowed; }
        .cp-msg { font-size: 13px; margin-top: 14px; min-height: 18px; text-align: center; }
        .cp-msg.err { color: #dc2626; }
        .cp-msg.ok { color: #0f8a5f; }
        .cp-alt { text-align: center; margin-top: 16px; font-size: 13px; }
        .cp-alt a { color: #1f6fe5; text-decoration: none; font-weight: 600; }
        /* Dark mode */
        html[data-theme="dark"] { color-scheme: dark; }
        html[data-theme="dark"] body { background: #0b1220; color: #e7edf6; }
        html[data-theme="dark"] .cp-card { background: #161f2e; border-color: #2b3a52; box-shadow: 0 18px 50px rgba(0,0,0,.5); }
        html[data-theme="dark"] h1 { color: #eef2f8; }
        html[data-theme="dark"] .cp-sub { color: #9fb0c4; }
        html[data-theme="dark"] label { color: #c2cddd; }
        html[data-theme="dark"] input[type=password] { background: #1b2537; color: #e7edf6; border-color: #33425c; }
        html[data-theme="dark"] .cp-note { background: rgba(31,111,229,.14); border-color: rgba(31,111,229,.35); color: #9cc4ff; }
    </style>
</head>
<body>
    <div class="cp-card">
        <img class="cp-logo" src="/static/atlas-standards-logo.svg" alt="Atlas Excellence" onerror="this.style.display='none'">
        <h1>Set a new password</h1>
        <p class="cp-sub">Hi {{ display_name }}, choose a new password for your account.</p>

        {% if forced %}
        <div class="cp-note"><i class="fas fa-shield-halved"></i>
            <span>Your administrator reset your password. Please create a new one to continue.</span></div>
        {% endif %}

        <form id="cpForm" autocomplete="off">
            {% if not forced %}
            <div class="cp-field">
                <label for="current">Current password</label>
                <input type="password" id="current" autocomplete="current-password" required>
            </div>
            {% endif %}
            <div class="cp-field">
                <label for="pw1">New password</label>
                <input type="password" id="pw1" autocomplete="new-password" minlength="6" required>
            </div>
            <div class="cp-field">
                <label for="pw2">Confirm new password</label>
                <input type="password" id="pw2" autocomplete="new-password" minlength="6" required>
            </div>
            <button class="cp-btn" id="cpBtn" type="submit">Save new password</button>
            <div class="cp-msg" id="cpMsg"></div>
        </form>

        {% if not forced %}
        <div class="cp-alt"><a href="/">← Back to dashboard</a></div>
        {% endif %}
    </div>

    <script>
        const FORCED = {{ 'true' if forced else 'false' }};
        const form = document.getElementById('cpForm');
        const msg = document.getElementById('cpMsg');
        const btn = document.getElementById('cpBtn');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            msg.className = 'cp-msg';
            const pw1 = document.getElementById('pw1').value;
            const pw2 = document.getElementById('pw2').value;
            if (pw1.length < 6) { msg.textContent = 'Password must be at least 6 characters.'; msg.className = 'cp-msg err'; return; }
            if (pw1 !== pw2) { msg.textContent = 'The passwords do not match.'; msg.className = 'cp-msg err'; return; }
            const payload = { new_password: pw1 };
            if (!FORCED) { payload.current_password = document.getElementById('current').value; }
            btn.disabled = true;
            try {
                const r = await fetch('/api/profile/password', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
                });
                const d = await r.json();
                if (r.ok && d.status === 'success') {
                    msg.textContent = 'Password updated. Redirecting…'; msg.className = 'cp-msg ok';
                    setTimeout(() => { window.location.href = '/'; }, 800);
                } else {
                    msg.textContent = d.message || 'Could not update password.'; msg.className = 'cp-msg err';
                    btn.disabled = false;
                }
            } catch (err) {
                msg.textContent = 'Network error. Please try again.'; msg.className = 'cp-msg err';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
