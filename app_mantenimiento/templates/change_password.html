<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set a new password — Atlas Excellence</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400..800&family=JetBrains+Mono:wght@400..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('atlasTheme');
                if (t !== 'light' && t !== 'dark') {
                    t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        /* Precision skin (Nov 2026), as on the sign-in page it follows: the
           grid page, a white card with a hairline, a mono eyebrow, navy
           accents, and the Atlas Excellence wordmark (it showed the old
           "Atlas Standards" one). */
        body { font-family: 'Roboto', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
            background-color: #f4f6f8; color: #1b2730;
            background-image: linear-gradient(rgba(0,51,102,.045) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0,51,102,.045) 1px, transparent 1px);
            background-size: 24px 24px;
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .cp-card { width: 100%; max-width: 420px; background: #fff; border: 1px solid #e1e5ea;
            border-radius: 8px; padding: 32px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
        .cp-logo { height: 52px; margin-bottom: 24px; }
        .cp-eyebrow { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11.5px;
            font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: #00709a; margin-bottom: 6px; }
        h1 { font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 6px; }
        .cp-sub { font-size: 14px; color: #5a6872; margin-bottom: 22px; line-height: 1.5; }
        .cp-note { display: flex; gap: 10px; background: #e8eef4; border: 1px solid #d3dde8;
            color: #1b2730; border-radius: 8px; padding: 12px 14px; font-size: 13px; margin-bottom: 20px; }
        .cp-note i { color: #003366; margin-top: 2px; }
        .cp-field { margin-bottom: 16px; }
        label { display: block; font-size: 13.5px; font-weight: 600; color: #1b2730; margin-bottom: 7px; }
        input[type=password] { width: 100%; padding: 12px 14px; border: 1px solid #cfd6dd;
            border-radius: 8px; font-size: 15px; font-family: inherit; background: #fff; color: #1b2730; }
        input[type=password]:focus { outline: none; border-color: #003366; box-shadow: 0 0 0 3px rgba(0,51,102,.14); }
        .cp-btn { width: 100%; margin-top: 6px; background: #003366; color: #fff; border: none;
            border-radius: 8px; padding: 13px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer;
            transition: background-color .2s ease-out, box-shadow .2s ease-out; }
        .cp-btn:hover { background: #002a54; box-shadow: 0 6px 16px rgba(0,51,102,.22); }
        .cp-btn:disabled { opacity: .6; cursor: not-allowed; }
        .cp-msg { font-size: 13px; margin-top: 14px; min-height: 18px; text-align: center; }
        .cp-msg.err { color: #b42318; }
        .cp-msg.ok { color: #0b6b49; }
        .cp-alt { text-align: center; margin-top: 16px; font-size: 13px; }
        .cp-alt a { color: #003366; text-decoration: none; font-weight: 600; }
        /* Dark mode */
        html[data-theme="dark"] { color-scheme: dark; }
        html[data-theme="dark"] body { background-color: #0b1220; color: #e7edf6;
            background-image: linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px); }
        html[data-theme="dark"] .cp-logo { filter: brightness(0) invert(1); opacity: .92; }
        html[data-theme="dark"] .cp-eyebrow { color: #5cc8f0; }
        html[data-theme="dark"] .cp-alt a { color: #9cc4ff; }
        html[data-theme="dark"] .cp-note i { color: #9cc4ff; }
        html[data-theme="dark"] .cp-card { background: #161f2e; border-color: #2b3a52; box-shadow: none; }
        html[data-theme="dark"] h1 { color: #eef2f8; }
        html[data-theme="dark"] .cp-sub { color: #9fb0c4; }
        html[data-theme="dark"] label { color: #c2cddd; }
        html[data-theme="dark"] input[type=password] { background: #1b2537; color: #e7edf6; border-color: #33425c; }
        html[data-theme="dark"] .cp-note { background: #1b2a42; border-color: #2b3a52; color: #cfe0ff; }
    </style>
</head>
<body>
    <div class="cp-card">
        <img class="cp-logo" src="/static/arlas-excellence-logo.png" alt="Atlas Excellence" onerror="this.style.display='none'">
        <div class="cp-eyebrow">Account security</div>
        <h1>Set a new password</h1>
        <p class="cp-sub">Hi {{ display_name }}, choose a new password for your account.</p>

        {% if forced %}
        <div class="cp-note"><i class="fas fa-shield-halved"></i>
            <span>Your administrator reset your password. Please create a new one to continue.</span></div>
        {% endif %}

        <form id="cpForm" autocomplete="off">
            {% if not forced %}
            <div class="cp-field">
                <label for="current">Current password</label>
                <input type="password" id="current" autocomplete="current-password" required>
            </div>
            {% endif %}
            <div class="cp-field">
                <label for="pw1">New password</label>
                <input type="password" id="pw1" autocomplete="new-password" minlength="6" required>
            </div>
            <div class="cp-field">
                <label for="pw2">Confirm new password</label>
                <input type="password" id="pw2" autocomplete="new-password" minlength="6" required>
            </div>
            <button class="cp-btn" id="cpBtn" type="submit">Save new password</button>
            <div class="cp-msg" id="cpMsg"></div>
        </form>

        {% if not forced %}
        <div class="cp-alt"><a href="/">← Back to dashboard</a></div>
        {% endif %}
    </div>

    <script>
        const FORCED = {{ 'true' if forced else 'false' }};
        const form = document.getElementById('cpForm');
        const msg = document.getElementById('cpMsg');
        const btn = document.getElementById('cpBtn');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            msg.className = 'cp-msg';
            const pw1 = document.getElementById('pw1').value;
            const pw2 = document.getElementById('pw2').value;
            if (pw1.length < 6) { msg.textContent = 'Password must be at least 6 characters.'; msg.className = 'cp-msg err'; return; }
            if (pw1 !== pw2) { msg.textContent = 'The passwords do not match.'; msg.className = 'cp-msg err'; return; }
            const payload = { new_password: pw1 };
            if (!FORCED) { payload.current_password = document.getElementById('current').value; }
            btn.disabled = true;
            try {
                const r = await fetch('/api/profile/password', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
                });
                const d = await r.json();
                if (r.ok && d.status === 'success') {
                    msg.textContent = 'Password updated. Redirecting…'; msg.className = 'cp-msg ok';
                    setTimeout(() => { window.location.href = '/'; }, 800);
                } else {
                    msg.textContent = d.message || 'Could not update password.'; msg.className = 'cp-msg err';
                    btn.disabled = false;
                }
            } catch (err) {
                msg.textContent = 'Network error. Please try again.'; msg.className = 'cp-msg err';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
